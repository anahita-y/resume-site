{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رزومه ثبت شد</title>
  <style>
    body { margin: 0; font-family: Vazirmatn, Tahoma, sans-serif; background: linear-gradient(180deg, #e8eff9 0, #f5f7fb 320px); color: #1f2937; }
    .box { max-width: 560px; margin: 48px auto; background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 18px rgba(18,69,143,.10); border-bottom: 4px solid #12458f; }
    .logos { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .logos img.uni { height: 90px; }
    .logos img.assoc { height: 66px; }
    h1 { color: #12458f; font-size: 22px; }
    p { color: #6b7280; line-height: 1.9; }
    a.btn { display: inline-block; margin-top: 12px; background: linear-gradient(90deg, #12458f, #2d6cdf); color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logos">
      <img class="uni" src="{% static 'resumes/img/logo_university.jpg' %}" alt="">
      <img class="assoc" src="{% static 'resumes/img/logo_association.jpg' %}" alt="">
    </div>
    <h1>رزومه‌ات با موفقیت ثبت شد ✅</h1>
    {% if resume.pdf %}
      <p>فایل PDF رزومه‌ات آماده است. می‌تونی همین حالا دانلودش کنی.</p>
      <a class="btn" href="{% url 'resumes:download' resume.token %}">دانلود رزومه (PDF)</a>
    {% else %}
      <p>اطلاعاتت ثبت شد، ولی ساخت فایل PDF با مشکل مواجه شد. نگران نباش؛ رزومه‌ات برات ارسال می‌شه.</p>
    {% endif %}
  </div>
</body>
</html>
